name: Deploy Website

on:
  push:
    branches: [main]
    paths: &paths
      - "website/**"
      - ".mise.toml"
      - ".github/workflows/deploy-website.yml"
  # Build only, so a toolchain change that breaks the site fails before merge.
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install npm dependencies
        run: npm ci
        working-directory: website

      # Hugo and Dart Sass versions come from .mise.toml, same as `just build-website`.
      - name: Install Hugo and Dart Sass
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: hugo-extended github:sass/dart-sass

      - name: Build site
        run: hugo --minify --gc --environment production
        working-directory: website

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/public

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
