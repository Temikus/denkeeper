name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write        # Required for cosign keyless OIDC signing and build attestations
  attestations: write    # Required for actions/attest-build-provenance
  security-events: write # Required for Grype SARIF upload

jobs:
  build-ui:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        run: cd web && npm ci && npm run build
      - name: Upload web UI artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-dist
          path: internal/web/dist/
          retention-days: 1

  test:
    name: Test
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-ui-dist
          path: internal/web/dist/
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      - run: go test -race ./...

  release:
    name: Release
    needs: [test, build-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-ui-dist
          path: internal/web/dist/
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Cache Go modules and build
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-
      # cosign for keyless signing of the checksums file
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # syft for SBOM generation (goreleaser sboms: section shells out to syft)
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GitHub PAT with repo write access on Temikus/homebrew-denkeeper.
          # Add at: github.com/Temikus/denkeeper/settings/secrets/actions
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  helm:
    name: Helm Chart
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Set chart version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version: .*/version: ${VERSION}/" deploy/helm/denkeeper/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${VERSION}\"/" deploy/helm/denkeeper/Chart.yaml
      - name: Package chart
        run: helm package deploy/helm/denkeeper --destination "$RUNNER_TEMP"
      - name: Push chart to GHCR
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm push "$RUNNER_TEMP/denkeeper-${VERSION}.tgz" oci://ghcr.io/temikus/charts

  docker:
    name: Docker
    needs: [test, build-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-ui-dist
          path: internal/web/dist/
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/temikus/denkeeper
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/temikus/denkeeper:buildcache
          cache-to: type=registry,ref=ghcr.io/temikus/denkeeper:buildcache,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.head_commit.timestamp }}
      # Scan the pushed image for vulnerabilities before signing
      - name: Scan container image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        id: grype-scan
        with:
          image: "ghcr.io/temikus/denkeeper@${{ steps.build.outputs.digest }}"
          severity-cutoff: "high"
          only-fixed: "true"
          output-format: "sarif"
      - name: Upload container scan SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
      # Sign by digest (immutable) rather than tag (mutable)
      - name: Sign Docker image
        run: |
          cosign sign --yes \
            ghcr.io/temikus/denkeeper@${{ steps.build.outputs.digest }}
      # Attach SLSA build provenance attestation to the image
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/temikus/denkeeper
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  stamp-prs:
    name: Stamp Released PRs
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # PR comments go through the issues API
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Map every commit in this release back to its PR via the GitHub API rather
      # than parsing commit subjects — history mixes squash merges, merge commits
      # and direct pushes to main, so subject parsing would miss cases.
      - name: Comment on PRs included in this release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          RANGE="${PREV:+${PREV}..}${VERSION}"
          echo "Release range: ${RANGE}"
          PRS=$(git log --format='%H' "${RANGE}" \
            | xargs -I{} gh api "repos/${GITHUB_REPOSITORY}/commits/{}/pulls" --jq '.[].number' \
            | sort -un)
          if [ -z "${PRS}" ]; then
            echo "No PRs associated with this range."
            exit 0
          fi
          while read -r pr; do
            echo "Commenting on #${pr}"
            gh pr comment "${pr}" --repo "${GITHUB_REPOSITORY}" \
              --body "🚀 Released in [\`${VERSION}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${VERSION})"
          done <<< "${PRS}"
